name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            build_command: python scripts/build_windows.py
            bundle: release/PHP2Shell Radar.exe
            output: PHP2Shell-Radar-windows-x64.exe
          - platform: Linux x64
            runner: ubuntu-22.04
            build_command: python scripts/build_linux.py
            bundle: build/linux-dist/PHP2Shell-Radar
            output: PHP2Shell-Radar-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[build-windows,build-linux,test]"
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Run offline tests
        run: python scripts/ci_tests.py
      - name: Build package
        run: ${{ matrix.build_command }}
      - name: Smoke-test packaged GUI
        run: python scripts/smoke_bundle.py "${{ matrix.bundle }}"
      - name: Name release file
        shell: python
        env:
          PACKAGE_NAME: ${{ matrix.output }}
        run: |
          import os
          from pathlib import Path
          source = next(Path('release').glob('*.exe' if os.name == 'nt' else '*.tar.gz'))
          source.rename(source.with_name(os.environ['PACKAGE_NAME']))
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.output }}
          path: release/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true
      - name: Write SHA-256 checksums
        run: python scripts/write_checksums.py release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --verify-tag --title "PHP2Shell Radar $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "PHP2Shell Radar $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          if [ "$RELEASE_TAG" = "v1.0.0" ] && gh release view v0.1.0 >/dev/null 2>&1; then
            gh release delete v0.1.0 --yes --cleanup-tag
          fi
