[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-radar"
version = "1.1.0"
description = "Desktop PHP2Shell exposure inventory for business assets"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1", "dnspython>=2.7,<3", "cryptography>=43,<52"]

[project.gui-scripts]
php2shell-radar = "hunter.gui:main"

[project.optional-dependencies]
build-windows = ["pyinstaller>=6.16,<7"]
build-linux = ["pyinstaller>=6.16,<7"]
test = ["psutil>=6,<9"]

[tool.setuptools.packages.find]
include = ["hunter*"]

[tool.setuptools.package-data]
hunter = ["data/*.txt", "data/*.png", "data/*.svg", "data/*.ico"]
